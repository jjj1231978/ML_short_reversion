# Option A — "Conservative deepening" expansion of the May-9 13-factor baseline.
#
# Adds 7 paper-faithful factors per style group, all measured to have ≥86%
# cell coverage on the 2008+ multi-region universe (so should not collapse
# the per-week ticker count). All factors are non-residual (don't depend on
# market_close, which has a latent bug that zeroes IREV/BETA/IVOL/IMOM).
#
# Goal: enable the MLP ensemble member on a richer paper-aligned feature
# space without sacrificing the May-9 universe size (~620 tickers/week).
#
# Diffs vs may9.yaml:
#   * features.whitelist  — 13 → 20 factors covering 9 paper styles
#   * model.ensemble.members — add "mlp" (4 members total)
#   * max_missing_factors  — kept at 10 (paper convention is ~12%; for 20
#                            factors that would be 2-3, but the May-9 setup
#                            stays at 10 for direct comparability)

universe:
  index: "SP500"
  regions: ["US", "UK", "CA"]
  indexes:
    US: "SP500"
    UK: "FTSE100"
    CA: "TSX60"
  exclude_gics_sectors: [40]
  exclude_sectors: ["Financial Services"]
  min_adv_6m: 3_000_000
  adv_scaling_threshold: 20_000_000
  min_adv_6m_by_region:
    US: 3_000_000
    UK: 5_000_000
    CA: 100_000
  min_price_by_region:
    US: 3.0
    UK: 100.0
    CA: 3.0
  adv_scaling_threshold_by_region:
    US: 20_000_000
    UK: 50_000_000
    CA: 750_000

data:
  price_source: "fmp"
  fundamental_source: "fmp"
  universe_source: "fmp"
  databento_dataset: "EQUS.MINI"
  databento_schema: "ohlcv-1d"
  databento_cache_dir: "~/data_lake/databento/equities"
  massive_cache_dir: "~/data_lake/massive"
  simfin_cache_dir: "~/data_lake/simfin"
  fmp_cache_dir: "~/data_lake/fmp"
  fmp_rate_limit_per_min: 280
  fmp_history_start: "2006-01-01"
  start_date: "2006-01-01"
  end_date: "2026-04-11"
  fundamental_pub_lag_days: 90
  benchmarks:
    US: "^GSPC"
    UK: "^FTSE"
    CA: "XIU.TO"

features:
  whitelist:
    # Price Reversal (4)
    - R1W
    - RSI5D
    - RSI14
    - RSI30                # added
    # Price Momentum (4)
    - R1M                  # added
    - R3M1M
    - R6M1M                # added
    - R12M1M
    # Low Risk (2)
    - VOL6M
    - VOL12M               # added
    # Value (5)
    - PE
    - PB
    - EVSALES              # added (87% coverage)
    - EVEBIT               # added (87% coverage)
    - EVEBITDA             # added (87% coverage)
    # Profitability (5)
    - ROE
    - GPOA
    - ROA                  # added (87% coverage)
    - OPRDIC               # added (88% coverage)
    - GBROC                # added (Greenblatt's RoC, 87%)
    # Leverage (1)
    - DE                   # added (85% coverage)
    # Growth (1)
    - SALES_GROWTH_YOY     # added (86% coverage)
    # Earnings Quality (1)
    - ACCRUALS             # added (88% coverage)
    # Earnings Momentum proxy (kept)
    - UPDOWN1W_RATINGS

neutralization:
  winsorize_lower: 0.02
  winsorize_upper: 0.98
  zscore_iterations: 10
  zscore_cap: 3.0
  max_missing_factors: 10
  industry_level: "gics_sub_industry"

macro:
  enabled: false

target:
  horizon: "1W"
  day: "Wednesday"
  zscore_cross_sectional: true

model:
  type: "ensemble"
  ensemble:
    members: ["xgboost", "lightgbm", "random_forest", "mlp"]  # +MLP
    combine: "rank_mean"
  train_weeks: 78
  val_weeks: 26
  retrain_freq: 12
  xgboost:
    params:
      max_depth: 4
      learning_rate: 0.03
      n_estimators: 2000
      subsample: 0.7
      colsample_bytree: 0.7
      objective: "reg:squarederror"
      tree_method: "hist"
    early_stopping_rounds: 50
  lightgbm:
    params:
      objective: "regression"
      num_leaves: 31
      max_depth: -1
      learning_rate: 0.03
      n_estimators: 2000
      subsample: 0.7
      subsample_freq: 1
      colsample_bytree: 0.7
      verbose: -1
    early_stopping_rounds: 50
  random_forest:
    params:
      n_estimators: 400
      max_depth: 8
      min_samples_leaf: 50
      max_features: 0.7
      n_jobs: -1
      random_state: 42
  mlp:
    params:
      hidden_dims: [128, 64, 32]
      dropout: 0.2
      batchnorm: true
      lr: 0.001
      weight_decay: 0.00001
      batch_size: 256
      max_epochs: 200
      early_stopping_patience: 15
      grad_clip: 1.0
      activation: "relu"
      device: null
      seed: 42

backtest:
  rebalance_day: "Wednesday"
  long_quintile: 5
  short_quintile: 1
  weighting: "equal"
  trading_cost_bps: 1.5
  execution_lag_days: 1
  weekly_return_cap: 0.30

diagnostics:
  alpha_decay_lags: [0, 1, 2, 3, 4]
  weekday_signals: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"]
  run_weekday_effect: false
  shap_test_weeks: 26

reporting:
  profile: "cheap"
  briefing_model: null
  critique_model: null
  synth_model: null
  rounds: 1
  max_budget_usd: 0.30
  prompt_caching: true
  output_dir: "data/processed/reports"
