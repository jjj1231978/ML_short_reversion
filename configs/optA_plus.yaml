# Option A+ — Option A (24 factors) extended with the now-working
# market-residual factors that were dead in earlier runs due to the
# multi-region market_close alignment bug (fixed in src/features/factors.py:
# _align_market_to_stocks). 37 factors total.
#
# Adds 13 paper factors:
#   Price Reversal: IREV1W, IREV1M, IREVVOL1W, IREVVOL1M
#   Price Momentum: IMOM3M1M, IMOM12M1M, IMOMVOL3M1M, IMOMVOL12M1M
#   Low Risk:       IVOL6M, IVOL12M, BETA6M, BETA12M, SIZE
#
# Total breakdown by paper style:
#   Price Reversal (8): R1W, IREV1W, IREVVOL1W, RSI5D, RSI14, RSI30,
#                       IREV1M, IREVVOL1M
#   Price Momentum (8): R1M, R3M1M, R6M1M, R12M1M, IMOM3M1M, IMOM12M1M,
#                       IMOMVOL3M1M, IMOMVOL12M1M
#   Low Risk (7):       VOL6M, VOL12M, IVOL6M, IVOL12M, BETA6M, BETA12M, SIZE
#   Value (5):          PE, PB, EVSALES, EVEBIT, EVEBITDA
#   Profitability (5):  ROE, GPOA, ROA, OPRDIC, GBROC
#   Leverage (1):       DE
#   Growth (1):         SALES_GROWTH_YOY
#   Earnings Quality (1):     ACCRUALS
#   Earnings Momentum (1):    UPDOWN1W_RATINGS  (rating-changes proxy)
#
# Otherwise identical to optA.yaml (same model windows, 4-member ensemble).

universe:
  index: "SP500"
  regions: ["US", "UK", "CA"]
  indexes:
    US: "SP500"
    UK: "FTSE100"
    CA: "TSX60"
  exclude_gics_sectors: [40]
  exclude_sectors: ["Financial Services"]
  min_adv_6m: 3_000_000
  adv_scaling_threshold: 20_000_000
  min_adv_6m_by_region:
    US: 3_000_000
    UK: 5_000_000
    CA: 100_000
  min_price_by_region:
    US: 3.0
    UK: 100.0
    CA: 3.0
  adv_scaling_threshold_by_region:
    US: 20_000_000
    UK: 50_000_000
    CA: 750_000

data:
  price_source: "fmp"
  fundamental_source: "fmp"
  universe_source: "fmp"
  databento_dataset: "EQUS.MINI"
  databento_schema: "ohlcv-1d"
  databento_cache_dir: "~/data_lake/databento/equities"
  massive_cache_dir: "~/data_lake/massive"
  simfin_cache_dir: "~/data_lake/simfin"
  fmp_cache_dir: "~/data_lake/fmp"
  fmp_rate_limit_per_min: 280
  fmp_history_start: "2006-01-01"
  start_date: "2006-01-01"
  end_date: "2026-04-11"
  fundamental_pub_lag_days: 90
  benchmarks:
    US: "^GSPC"
    UK: "^FTSE"
    CA: "XIU.TO"

features:
  whitelist:
    # Price Reversal (8)
    - R1W
    - IREV1W              # added (was dead, now fixed)
    - IREVVOL1W           # added
    - RSI5D
    - RSI14
    - RSI30
    - IREV1M              # added
    - IREVVOL1M           # added
    # Price Momentum (8)
    - R1M
    - R3M1M
    - R6M1M
    - R12M1M
    - IMOM3M1M            # added
    - IMOM12M1M           # added
    - IMOMVOL3M1M         # added
    - IMOMVOL12M1M        # added
    # Low Risk (7)
    - VOL6M
    - VOL12M
    - IVOL6M              # added (was dead, now fixed)
    - IVOL12M             # added
    - BETA6M              # was in may9 but actually dead; now real
    - BETA12M             # added
    - SIZE                # added (Low Risk per paper)
    # Value (5)
    - PE
    - PB
    - EVSALES
    - EVEBIT
    - EVEBITDA
    # Profitability (5)
    - ROE
    - GPOA
    - ROA
    - OPRDIC
    - GBROC
    # Leverage (1)
    - DE
    # Growth (1)
    - SALES_GROWTH_YOY
    # Earnings Quality (1)
    - ACCRUALS
    # Earnings Momentum (1)
    - UPDOWN1W_RATINGS

neutralization:
  winsorize_lower: 0.02
  winsorize_upper: 0.98
  zscore_iterations: 10
  zscore_cap: 3.0
  max_missing_factors: 10
  industry_level: "gics_sub_industry"

macro:
  enabled: false

target:
  horizon: "1W"
  day: "Wednesday"
  zscore_cross_sectional: true

model:
  type: "ensemble"
  ensemble:
    members: ["xgboost", "lightgbm", "random_forest", "mlp"]
    combine: "rank_mean"
  train_weeks: 78
  val_weeks: 26
  retrain_freq: 12
  xgboost:
    params:
      max_depth: 4
      learning_rate: 0.03
      n_estimators: 2000
      subsample: 0.7
      colsample_bytree: 0.7
      objective: "reg:squarederror"
      tree_method: "hist"
    early_stopping_rounds: 50
  lightgbm:
    params:
      objective: "regression"
      num_leaves: 31
      max_depth: -1
      learning_rate: 0.03
      n_estimators: 2000
      subsample: 0.7
      subsample_freq: 1
      colsample_bytree: 0.7
      verbose: -1
    early_stopping_rounds: 50
  random_forest:
    params:
      n_estimators: 400
      max_depth: 8
      min_samples_leaf: 50
      max_features: 0.7
      n_jobs: -1
      random_state: 42
  mlp:
    params:
      hidden_dims: [128, 64, 32]
      dropout: 0.2
      batchnorm: true
      lr: 0.001
      weight_decay: 0.00001
      batch_size: 256
      max_epochs: 200
      early_stopping_patience: 15
      grad_clip: 1.0
      activation: "relu"
      device: null
      seed: 42

backtest:
  rebalance_day: "Wednesday"
  long_quintile: 5
  short_quintile: 1
  weighting: "equal"
  trading_cost_bps: 1.5
  execution_lag_days: 1
  weekly_return_cap: 0.30

diagnostics:
  alpha_decay_lags: [0, 1, 2, 3, 4]
  weekday_signals: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"]
  run_weekday_effect: false
  shap_test_weeks: 26

reporting:
  profile: "cheap"
  briefing_model: null
  critique_model: null
  synth_model: null
  rounds: 1
  max_budget_usd: 0.30
  prompt_caching: true
  output_dir: "data/processed/reports"
